name: fazenda-lucrativa

services:
  postgres:
    image: postgres
    container_name: fazenda-lucrativa-postgres
    environment:
      POSTGRES_DB: fazenda-lucrativa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - fazenda-lucrativa_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fazenda-lucrativa_postgres_data:
